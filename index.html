<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>بوابة بيرق - Bayraq Gate</title>
    <meta name="description" content="منصة تعليمية متطورة مع ميزات الذكاء الاصطناعي والتحديات التفاعلية." />
    <meta property="og:title" content="بوابة بيرق - Bayraq Gate" />
    <meta property="og:description" content="منصة تعليمية متطورة مع ميزات الذكاء الاصطناعي والتحديات التفاعلية." />
    <meta property="og:image" content="/logo.png" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <style>
      html, body {
        background-color: #020617 !important;
        color: #ffffff;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
      }
      #root {
        min-height: 100%;
        width: 100%;
        display: flex;
        flex-direction: column;
      }

      @keyframes bayraqSpin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes bayraqGlowPulse {
        0%, 100% { opacity: 0.35; transform: translate(-50%, -50%) scale(0.95); }
        50% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.15); }
      }
      @keyframes bayraqShimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
      }
    </style>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>
  <body class="bg-[#020617] text-white">
    <div id="root">
      <!-- Instant Preloader prior to JS/React bundle execution -->
      <div id="bayraq-preloader" style="position: fixed; inset: 0; background: linear-gradient(180deg, #020617 0%, #080f26 50%, #020617 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 99999; font-family: 'Cairo', system-ui, -apple-system, sans-serif; direction: rtl; text-align: center; color: white; padding: 24px; overflow: hidden; user-select: none;">
        
        <!-- Ambient radial glow background -->
        <div style="position: absolute; width: 320px; height: 320px; background: radial-gradient(circle, rgba(212,175,55,0.22) 0%, rgba(212,175,55,0) 70%); top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; animation: bayraqGlowPulse 2.8s ease-in-out infinite;"></div>

        <!-- Central Logo Emblem with Animated Ring -->
        <div style="position: relative; margin-bottom: 24px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 104px; height: 104px; border-radius: 50%; border: 2px solid rgba(212,175,55,0.2); border-top-color: #D4AF37; border-right-color: rgba(245,158,11,0.8); animation: bayraqSpin 1.1s cubic-bezier(0.5, 0, 0.5, 1) infinite; box-shadow: 0 0 35px rgba(212,175,55,0.3);"></div>
          <img src="/logo.png" alt="بوابة بيرق" style="position: absolute; width: 68px; height: 68px; object-fit: contain; border-radius: 50%; filter: drop-shadow(0 0 16px rgba(212,175,55,0.7));" onError="this.style.display='none';" />
        </div>

        <!-- App Name -->
        <h1 style="font-size: 28px; font-weight: 900; margin: 0 0 6px 0; background: linear-gradient(135deg, #FFFFFF 0%, #FFD700 50%, #F59E0B 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; text-shadow: 0 2px 12px rgba(212,175,55,0.3);">بوابة بيرق</h1>

        <!-- Subtitle Badge -->
        <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; background: rgba(212,175,55,0.1); border: 1px solid rgba(212,175,55,0.25); border-radius: 999px; margin-bottom: 28px;">
          <span style="width: 6px; height: 6px; border-radius: 50%; background-color: #D4AF37; box-shadow: 0 0 8px #D4AF37;"></span>
          <span style="font-size: 11px; font-weight: 800; color: #F59E0B; letter-spacing: 1.5px; text-transform: uppercase;">GATE 6 • المنصة التعليمية الذكية</span>
        </div>

        <!-- Progress Bar Container -->
        <div style="width: 220px; height: 5px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; position: relative; border: 1px solid rgba(212,175,55,0.2);">
          <div style="position: absolute; inset: 0; width: 100%; height: 100%; background: linear-gradient(90deg, #D4AF37, #FFD700, #F59E0B); border-radius: 999px; animation: bayraqShimmer 1.4s ease-in-out infinite;"></div>
        </div>

        <!-- Loading hint text -->
        <p style="font-size: 12px; color: rgba(255,255,255,0.6); margin-top: 14px; font-weight: 600; letter-spacing: 0.2px;">جاري فتح المنصة وتجهيز القاعات...</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
